# Local CLI configuration only. Remote project refs and credentials must never be committed.
project_id = "esads-beauty-hub"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/aceitar-convite"]

[functions.invite-user]
verify_jwt = true

[functions.provision-organization]
verify_jwt = true

[functions.create-billing-charge]
verify_jwt = true

[functions.asaas-webhook]
verify_jwt = false

[functions.whatsapp-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/whatsapp-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/whatsapp-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/whatsapp-webhook/*.html" ]
